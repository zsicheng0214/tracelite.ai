<style>
:root{
  --bg:#FAFAFA; --text:#111111; --text-2:#6E6E6E; --ocean:#171717;
  --teal:#2B2B2B; --aqua:#9A9A9A; --blue:#2B2B2B; --border:rgba(17, 17, 17, 0.12);
  --bg-rgb:250,250,250;
  --maxw:1180px; --pad:clamp(20px,5vw,56px); --section-y:clamp(96px,11vw,150px);
  --ease:cubic-bezier(.22,.61,.36,1); --ease-soft:cubic-bezier(.4,0,.2,1);
  --font-sans:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;-webkit-font-smoothing:antialiased;}
body{font-family:var(--font-sans);background:var(--bg);color:var(--text);font-size:17px;line-height:1.6;overflow-x:hidden;letter-spacing:-0.01em;}
a{color:inherit;text-decoration:none;}
.mono{font-family:var(--font-mono);font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--teal);}
.wrap{max-width:var(--maxw);margin:0 auto;padding-inline:var(--pad);}

/* NAV */
.nav{position:fixed;inset:0 0 auto 0;z-index:100;height:74px;display:flex;align-items:center;background:transparent;border-bottom:1px solid transparent;transition:background .5s var(--ease-soft),border-color .5s,backdrop-filter .5s;}
.nav.scrolled{background:rgba(var(--bg-rgb),.82);backdrop-filter:blur(14px) saturate(1.2);-webkit-backdrop-filter:blur(14px) saturate(1.2);border-bottom:1px solid var(--border);}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;width:100%;}
.brand{display:flex;align-items:center;gap:11px;font-weight:600;font-size:19px;letter-spacing:-0.02em;}
.brand .logo{height:26px;width:auto;flex:none;display:block;}
.nav-links{display:flex;align-items:center;gap:32px;}
.nav-links a.lk{font-size:15px;color:var(--text-2);position:relative;padding:4px 0;transition:color .25s var(--ease-soft);}
.nav-links a.lk::after{content:"";position:absolute;left:0;bottom:-2px;height:1px;width:0;background:var(--teal);transition:width .3s var(--ease);}
.nav-links a.lk:hover{color:var(--text);}
.nav-links a.lk:hover::after{width:100%;}
.nav-links a.lk.active{padding:6px 12px;border:1px solid var(--teal);border-radius:6px;color:var(--teal);}
.nav-links a.lk.active::after{display:none;}
.nav-links a.lk.active:hover{color:var(--ocean);border-color:var(--ocean);}
.nav-cta{display:flex;align-items:center;gap:22px;}
.nav-cta .nav-links{gap:22px;}
.nav-cta a{font-size:15px;display:inline-flex;align-items:center;gap:5px;color:var(--text);border-bottom:1px solid transparent;padding-bottom:2px;transition:color .25s,border-color .25s;}
.nav-cta a:hover{color:var(--teal);}
.nav-cta a.join{border-bottom-color:var(--teal);}
.nav-cta a.join:hover{color:var(--teal);}
.lang-toggle{font-size:13px;font-weight:600;line-height:1;color:var(--teal);background:transparent;
  border:1px solid var(--teal);border-radius:6px;padding:6px 10px;cursor:pointer;
  transition:background .25s,color .25s,border-color .25s,transform .25s var(--ease);}
.lang-toggle:hover{background:rgba(43,43,43,.08);color:var(--ocean);border-color:var(--ocean);}
.lang-toggle:active{transform:scale(.94);}
.narrow-only{display:none;}

/* 导航右侧社交按钮 */
.nav-cta .soc{display:inline-flex;align-items:center;justify-content:center;
  width:30px;height:30px;border:1px solid var(--border);border-radius:7px;padding:0;
  transition:border-color .25s,background-color .25s,transform .25s var(--ease);}
.nav-cta .soc:hover{border-color:var(--teal);background:rgba(255,255,255,.7);}
.nav-cta .soc:active{transform:scale(.94);}
.nav-cta .soc img{width:15px;height:15px;display:block;
  filter:grayscale(1) brightness(.35);}   /* 图标原是品牌色，压成中性灰 */
@media (max-width:767px){ .nav-cta .soc{display:none;} }

/* PAGE HERO */
.page-hero{position:relative;min-height:clamp(220px,26vh,300px);display:flex;align-items:flex-end;padding-top:108px;padding-bottom:28px;border-bottom:1px solid var(--border);overflow:hidden;}
.hero-bg{position:absolute;inset:0;z-index:0;pointer-events:none;}
.hero-bg .blob{position:absolute;border-radius:50%;filter:blur(72px);}
.hero-bg .blob-1{top:-150px;left:-90px;width:480px;height:480px;background:radial-gradient(circle at 50% 50%,rgba(17,17,17,.07),rgba(17,17,17,.025) 55%,rgba(17,17,17,0) 74%);}
.hero-bg .blob-2{top:-30px;left:320px;width:400px;height:400px;background:radial-gradient(circle at 50% 50%,rgba(17,17,17,.045),rgba(17,17,17,0) 72%);}
.hero-bg .hero-lines{position:absolute;inset:0;width:100%;height:100%;}
.hero-bg .tint{position:absolute;inset:0;background:linear-gradient(180deg,rgba(250,250,250,.2) 0%,rgba(250,250,250,.5) 45%,rgba(250,250,250,.9) 82%,var(--bg) 100%);}
.hero-content{position:relative;z-index:1;}
.page-hero h1{font-size:clamp(38px,6vw,76px);line-height:1.02;font-weight:600;letter-spacing:-0.035em;max-width:16ch;}
.page-hero p.lead{font-size:18px;line-height:1.62;color:var(--text-2);max-width:560px;margin-top:18px;}

/* REVEAL */
.reveal{opacity:0;transform:translateY(20px);transition:opacity .7s var(--ease-soft),transform .7s var(--ease);}
.reveal.in{opacity:1;transform:none;}
.reveal[data-d="1"]{transition-delay:.08s;}
.reveal[data-d="2"]{transition-delay:.16s;}

/* FIELD NOTES */
.notes{padding-top:34px;padding-bottom:var(--section-y);}
.section-head{max-width:760px;}
.eyebrow{display:block;margin-bottom:14px;}
h2.title{font-size:clamp(32px,4.4vw,56px);line-height:1.05;font-weight:600;letter-spacing:-0.03em;}
.notes-list{margin-top:16px;}
.note-row{display:grid;grid-template-columns:minmax(140px,220px) 1fr;gap:20px;align-items:stretch;cursor:pointer;padding-top:22px;padding-bottom:22px;border-top:1px solid var(--border);transition:transform .3s var(--ease);}
.note-row:first-of-type{border-top:none;padding-top:8px;}
.note-row .note-thumb{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:6px;background:var(--border);}
.note-row .note-body{display:flex;flex-direction:column;justify-content:space-between;gap:10px;padding:2px 0;}
.note-row .nt{font-size:clamp(18px,2.2vw,26px);font-weight:600;letter-spacing:-0.025em;line-height:1.25;transition:color .3s;}
.note-row .ns{font-size:14px;line-height:1.55;color:var(--text-2);}
.note-row .note-meta{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
.note-row .tags{display:flex;gap:6px;flex-wrap:wrap;}
.note-row .tag{font-family:var(--font-mono);font-size:10px;letter-spacing:.06em;text-transform:uppercase;color:var(--teal);background:rgba(43,43,43,.08);padding:4px 8px;border-radius:4px;}
.note-row .nd{font-family:var(--font-mono);font-size:11px;color:var(--text-2);letter-spacing:.06em;}
.note-row .na{display:none;}
.note-row:hover{transform:translateY(-2px);}
.note-row:hover .nt{color:var(--teal);}

/* BLOG ARTICLE MODAL */
.blog-modal{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;padding:24px;}
.blog-modal.open{display:flex;}
.pm-backdrop{position:absolute;inset:0;background:rgba(17,17,17,.42);backdrop-filter:blur(4px);opacity:0;transition:opacity .35s var(--ease);}
.blog-modal.open .pm-backdrop{opacity:1;}
.pm-card{
  position:relative;width:min(720px,100%);max-height:88vh;overflow:auto;
  background:var(--bg);border:1px solid var(--border);border-radius:18px;
  padding:26px;box-shadow:0 40px 90px -30px rgba(17,17,17,.5);
  transform:translateY(28px) scale(.94);opacity:0;
  transition:transform .42s var(--ease),opacity .42s var(--ease);
}
.blog-modal.open .pm-card{transform:translateY(0) scale(1);opacity:1;}
.pm-close{position:absolute;top:18px;right:18px;width:34px;height:34px;border-radius:50%;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-size:18px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;
  box-shadow:0 4px 14px -6px rgba(17,17,17,.35);z-index:2;
  transition:border-color .25s,color .25s,background .25s,transform .25s var(--ease);}
.pm-close:hover{border-color:var(--teal);color:var(--teal);background:rgba(43,43,43,.08);transform:scale(1.06);}
.pm-cover{width:100%;aspect-ratio:16/8;border-radius:12px;object-fit:cover;margin-top:46px;margin-bottom:20px;background:var(--border);}
.pm-card h3{font-size:clamp(22px,2.8vw,30px);font-weight:600;line-height:1.2;letter-spacing:-0.025em;color:var(--text);}
.pm-meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px;}
.pm-meta span{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.04em;color:var(--teal);background:rgba(43,43,43,.10);border-radius:6px;padding:3px 9px;}
.pm-body{margin-top:20px;font-size:16px;line-height:1.75;color:var(--text-2);}
.pm-body p{margin-bottom:16px;}
.pm-body p:last-child{margin-bottom:0;}
@media (max-width:767px){
  .note-row{grid-template-columns:1fr;gap:16px;}
  .note-row .note-thumb{aspect-ratio:16/9;}
}

/* 公众号二维码页 */
.wechat-page{padding-block:clamp(48px,6vw,84px) clamp(70px,9vw,120px);}
.qr-card{display:flex;flex-direction:column;align-items:center;gap:18px;
  width:min(100%,360px);margin:0 auto;padding:28px;
  border:1px solid var(--border);border-radius:16px;background:var(--bg);}
.qr-card img{width:100%;height:auto;display:block;border-radius:10px;}
.qr-card figcaption{font-family:var(--font-mono);font-size:11.5px;letter-spacing:.1em;
  text-transform:uppercase;color:var(--text-2);}

/* FOOTER */
.footer{background:var(--ocean);color:rgba(245,245,245,.7);padding-block:56px 40px;margin-top:0;}
.footer .f-top{display:flex;justify-content:space-between;align-items:flex-start;gap:40px;flex-wrap:wrap;}
.footer .f-brand{font-size:21px;font-weight:600;color:#F5F5F5;display:flex;align-items:center;gap:11px;}
.footer .f-brand .logo{height:30px;width:auto;display:block;filter:brightness(0) invert(1);}
.footer .f-tag{margin-top:14px;font-size:14px;max-width:280px;line-height:1.6;color:rgba(245,245,245,.6);}
.footer .f-col{display:flex;gap:28px;flex-wrap:wrap;}
.footer .f-col a{font-size:15px;color:rgba(245,245,245,.72);transition:color .25s;}
.footer .f-col a:hover{color:#fff;}
.footer .f-bottom{margin-top:44px;padding-top:22px;border-top:1px solid rgba(255,255,255,.12);font-family:var(--font-mono);font-size:11px;letter-spacing:.1em;color:rgba(245,245,245,.5);}

/* RESPONSIVE */
@media (max-width:767px){
  body{font-size:16px;}
  .nav-links{display:none;}
  .nav-cta .ext{display:none;}
  .narrow-only{display:inline-flex;}
  .page-hero{padding-top:104px;padding-bottom:34px;}
  .note-row{grid-template-columns:auto 1fr;}
  .note-row .na{display:none;}
  .footer .f-top{flex-direction:column;gap:28px;}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001ms!important;transition-duration:.001ms!important;}
  .reveal{opacity:1;transform:none;}
}
</style>

    <h3 id="bmTitle"></h3>
    <div class="pm-meta" id="bmMeta"></div>
    <div class="pm-body" id="bmBody"></div>
  </div>
</div>

<script>
/* nav scrolled state */
const nav = document.getElementById('nav');
const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 24);
window.addEventListener('scroll', onScroll, {passive:true}); onScroll();

/* reveal on scroll */
const io = new IntersectionObserver((entries)=>{
  entries.forEach(e=>{ if(e.isIntersecting){ e.target.classList.add('in'); io.unobserve(e.target); } });
},{threshold:.16, rootMargin:'0px 0px -8% 0px'});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* language toggle for nav (EN / 中文) */
(function(){
  const dict = { research:['Research','研究'], blog:['Blog','博客'], contact:['Contact','联系'] };
  const navItems = Array.from(document.querySelectorAll('[data-i18n]'));
  const btn = document.getElementById('langToggle');
  let zh = false;
  function apply(){
    navItems.forEach(el=>{ const k=el.dataset.i18n; el.textContent = dict[k][zh?1:0]; });
    btn.textContent = zh ? 'EN' : '中';
    document.documentElement.lang = zh ? 'zh' : 'en';
  }
  btn.addEventListener('click', ()=>{ zh=!zh; apply(); });
  apply();
})();

/* ===== Blog article modal ===== */
(function(){
  const modal = document.getElementById('blogModal');
  if(!modal) return;
  const bmCover = document.getElementById('bmCover');
  const bmTitle = document.getElementById('bmTitle');
  const bmMeta = document.getElementById('bmMeta');
  const bmBody = document.getElementById('bmBody');
  let lastFocus = null;

  function open(row){
    bmTitle.textContent = row.querySelector('.nt')?.textContent || '';
    bmCover.src = row.querySelector('.note-thumb')?.getAttribute('src') || '';
    bmCover.alt = row.querySelector('.note-thumb')?.getAttribute('alt') || '';
    const tags = Array.from(row.querySelectorAll('.tag')).map(t=>t.textContent.trim());
    const date = row.querySelector('.nd')?.textContent.trim() || '';
    bmMeta.innerHTML = tags.map(t=>`<span>${t}</span>`).join('') + (date?`<span>${date}</span>`:'');
    bmBody.innerHTML = Array.from(row.querySelectorAll('.na'))
      .map(p=>`<p>${p.textContent.trim()}</p>`).join('');
    modal.classList.add('open');
    modal.setAttribute('aria-hidden','false');
    document.body.style.overflow = 'hidden';
    lastFocus = document.activeElement;
    const c = modal.querySelector('.pm-close'); if(c) c.focus();
  }
  function close(){
    modal.classList.remove('open');
    modal.setAttribute('aria-hidden','true');
    document.body.style.overflow = '';
    if(lastFocus) lastFocus.focus();
  }

  document.querySelectorAll('.note-row').forEach(row=>{
    row.addEventListener('click', ()=> open(row));
    row.addEventListener('keydown', e=>{ if(e.key==='Enter' || e.key===' '){ e.preventDefault(); open(row); } });
  });
  modal.querySelectorAll('[data-close]').forEach(el=> el.addEventListener('click', close));
  document.addEventListener('keydown', e=>{ if(e.key==='Escape' && modal.classList.contains('open')) close(); });
})();
</script>
</body>
</html>
